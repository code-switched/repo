[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ghapi>=1.0.8",
    "prompt-toolkit>=3.0.52",
]

[project.optional-dependencies]
dev = [
    "pylint>=4.0.4",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[project.scripts]
repo = "repo.cli.main:main"
